name: Release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build-and-test:
    name: Build, Test
    uses: ./.github/workflows/build-and-test.yml

  release:
    name: Pack, Publish, Release
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points to main
        run: |
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} does not point to main."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set package version from tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Pack Errgo
        run: dotnet pack Errgo/Errgo.csproj -c Release -p:Version=$VERSION -o artifacts/packages

      - name: Pack Errgo.Analyzer
        run: dotnet pack Errgo.Analyzer/Errgo.Analyzer.Package/Errgo.Analyzer.Package.csproj -c Release -p:Version=$VERSION -o artifacts/packages

      - name: Push to NuGet
        run: dotnet nuget push artifacts/packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg